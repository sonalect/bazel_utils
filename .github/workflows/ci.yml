name: CI

# Every public rule is exercised by //... (tests/, unit tests, lint) on all six
# supported platforms. Runs for pull requests and release tags, not every push.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BAZELISK_VERSION: 1.30.0

jobs:
  bazel:
    name: Bazel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-26.04
            bazelisk: bazelisk-linux-amd64
            bazelisk_sha256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
            bazel: bazel
            shell: bash
            cache_root: ~/.cache/bazel-ci
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            bazelisk: bazelisk-linux-arm64
            bazelisk_sha256: b2bcc040c213b44586b121bda6d983c35df121b917c3a7a66fb16f2fa0df1a4f
            bazel: bazel
            shell: bash
            cache_root: ~/.cache/bazel-ci
          - platform: darwin-amd64
            runner: macos-26-intel
            bazelisk: bazelisk-darwin-amd64
            bazelisk_sha256: a0e6468b0c6b812f782d8cbfb05824121f6980c0bd70aaa1774fb8272bb7b2ad
            bazel: bazel
            shell: bash
            cache_root: ~/.cache/bazel-ci
          - platform: darwin-arm64
            runner: macos-26
            bazelisk: bazelisk-darwin-arm64
            bazelisk_sha256: 555d2ff912ccd336d0060bdb5251ef2f62629c6f8fbadb59005a45d5625793ec
            bazel: bazel
            shell: bash
            cache_root: ~/.cache/bazel-ci
          - platform: windows-amd64
            runner: windows-2025
            bazelisk: bazelisk-windows-amd64.exe
            bazelisk_sha256: 5d14a31e9d8a363c48ba1900dbd56764d730835232eb0d113cce255856ffe3ef
            bazel: bazel.exe
            # PowerShell, not Git Bash, so Bazel does not inherit Git's Unix tools.
            shell: pwsh
            cache_root: C:/bazel-ci
          - platform: windows-arm64
            runner: windows-11-arm
            bazelisk: bazelisk-windows-arm64.exe
            bazelisk_sha256: cb832b1d157e0dc5f89108da426f9c6fe087f5b15873e072480ec49cc5afe488
            bazel: bazel.exe
            shell: pwsh
            cache_root: C:/bazel-ci
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      # Keep LF so buildifier, markdownlint, and `git diff` see the committed bytes.
      - name: Disable CRLF conversion
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Bazelisk
        shell: bash
        env:
          BAZELISK: ${{ matrix.bazelisk }}
          BAZELISK_SHA256: ${{ matrix.bazelisk_sha256 }}
          BAZEL_EXE: ${{ matrix.bazel }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/bazelisk"
          mkdir -p "${dir}"
          curl -fsSL -o "${dir}/${BAZEL_EXE}" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/${BAZELISK}"
          # macOS's BSD sha256sum cannot read a checklist from stdin, so
          # compute the hash and compare it here. Hash stdin: with a Windows
          # path argument, Git Bash's shasum prefixes the hash with `\`.
          if command -v shasum >/dev/null; then
            actual="$(shasum -a 256 < "${dir}/${BAZEL_EXE}" | awk '{print $1}')"
          else
            actual="$(sha256sum < "${dir}/${BAZEL_EXE}" | awk '{print $1}')"
          fi
          if [[ "${actual}" != "${BAZELISK_SHA256}" ]]; then
            echo "bazelisk sha256 mismatch: got ${actual}, want ${BAZELISK_SHA256}" >&2
            exit 1
          fi
          chmod +x "${dir}/${BAZEL_EXE}"
          echo "${dir}" >> "${GITHUB_PATH}"

      - name: Cache Bazel
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ matrix.cache_root }}
            ~/.cache/bazelisk
            ~/Library/Caches/bazelisk
            ~/AppData/Local/bazelisk
          key: bazel-${{ matrix.platform }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'markdown/pnpm-lock.yaml', 'go/go.sum') }}
          restore-keys: |
            bazel-${{ matrix.platform }}-

      # Portable caches only. Do not persist output_user_root: it includes the
      # sandbox, execroot, and a live Bazel server.
      - name: Configure Bazel
        shell: bash
        env:
          CACHE_ROOT: ${{ matrix.cache_root }}
        run: |
          set -euo pipefail
          root="${CACHE_ROOT/#\~/${HOME}}"
          mkdir -p "${root}/disk" "${root}/repo"
          {
            if [[ "${RUNNER_OS}" == Windows ]]; then
              # Short output root: Windows MAX_PATH.
              echo "startup --output_user_root=C:/b"
              # No host bash: bazel_utils runs its scripts with busybox-w32, so
              # anything that still reaches for Bazel's shell fails loudly.
              echo "common --shell_executable=C:/no-host-bash/bash.exe"
            fi
            echo "common --disk_cache=${root}/disk"
            echo "common --repository_cache=${root}/repo"
          } >> "${HOME}/.bazelrc"

      - name: Build
        run: bazel build //... --keep_going

      - name: Test
        run: bazel test //... --keep_going --test_output=errors

      # `bazel run` targets: each must run and leave the checkout unchanged.
      - name: Run buildifier_format
        run: bazel run //:format

      - name: Run buf_format
        run: bazel run //tests/buf:format

      - name: Run ruff_format
        run: bazel run //tests/python:format

      - name: Check formatters left no changes
        run: git diff --exit-code

      # Stop the server so repository/disk caches are idle before actions/cache saves them.
      - name: Stop Bazel
        if: always()
        run: bazel shutdown
